# Tuwunel Matrix Homeserver — Caddy Docker Proxy setup
# Docs: https://matrix-construct.github.io/tuwunel/deploying/docker.html
#
# SETUP:
#   1. cp .env.example .env  and fill in the values
#   2. docker network create caddy
#   3. docker compose up -d

services:
    caddy:
        # caddy-docker-proxy: configures Caddy from container labels
        # https://github.com/lucaslorentz/caddy-docker-proxy
        image: lucaslorentz/caddy-docker-proxy:2.13.1-alpine
        restart: unless-stopped
        ports:
            - 80:80
            - 443:443
        environment:
            - CADDY_INGRESS_NETWORKS=caddy
        networks:
            - caddy
        # Allows Caddy to reach services on host networking (livekit)
        extra_hosts:
            - "host.docker.internal:host-gateway"
        volumes:
            - /var/run/docker.sock:/var/run/docker.sock
            - caddy_data:/data
        labels:
            # Serve .well-known endpoints for Matrix federation from the root domain.
            # This lets your Matrix IDs look like @user:example.com even though
            # the homeserver runs on matrix.example.com.
            caddy: ${SERVER_NAME}
            caddy.@matrix.path: /.well-known/matrix/*
            caddy.header: "@matrix"
            caddy.header.Access-Control-Allow-Origin: '"*"'
            caddy.header.Access-Control-Allow-Methods: '"GET, POST, PUT, DELETE, OPTIONS"'
            caddy.header.Access-Control-Allow-Headers: '"X-Requested-With, Content-Type, Authorization"'
            caddy.header.Content-Type: '"application/json"'
            caddy.0_respond: >-
                /.well-known/matrix/server {"m.server":"${MATRIX_SUBDOMAIN}:443"}
            caddy.1_respond: >-
                /.well-known/matrix/client
                {"m.homeserver":{"base_url":"https://${MATRIX_SUBDOMAIN}"},"org.matrix.msc4143.rtc_foci":[{"type":"livekit","livekit_service_url":"https://${RTC_SUBDOMAIN}"}]}

    homeserver:
        image: ghcr.io/matrix-construct/tuwunel:v1.9.3
        restart: unless-stopped
        volumes:
            - db:/var/lib/tuwunel
            - backups:/var/lib/tuwunel-backups
            - ./tuwunel.toml:/etc/tuwunel.toml:ro
        environment:
            # HEALTHCHECK runs `tuwunel --health-check` as a separate invocation that
            # can't see `command:` args, so config must come via env instead.
            TUWUNEL_CONFIG: /etc/tuwunel.toml
            TUWUNEL_SERVER_NAME: ${SERVER_NAME}
            TUWUNEL_REGISTRATION_TOKEN: ${REGISTRATION_TOKEN}
            TUWUNEL_TURN_URIS: '["turns:${SERVER_NAME}?transport=tcp","turn:${SERVER_NAME}?transport=udp","turn:${SERVER_NAME}?transport=tcp"]'
            TUWUNEL_TURN_SECRET: ${TURN_SECRET}
            # Logging (uncomment to adjust verbosity)
            #TUWUNEL_LOG: warn,state_res=warn
        networks:
            - caddy
        labels:
            caddy: ${MATRIX_SUBDOMAIN}
            caddy.reverse_proxy: "{{upstreams 6167}}"

    coturn:
        image: coturn/coturn:4.17.2
        restart: unless-stopped
        network_mode: host
        # Replaces the image's default command, so its --log-file and --external-ip are repeated here.
        # External IP is fixed: the public IP is bound directly to eth0 (same as livekit.yaml's node_ip).
        command:
            - --log-file=stdout
            - --external-ip=72.61.0.158
            - --static-auth-secret=${TURN_SECRET}
            - --realm=${SERVER_NAME}
        volumes:
            - ./coturn.conf:/etc/coturn/turnserver.conf:ro

    matrix-rtc-jwt:
        # lk-jwt-service: issues LiveKit tokens for Element Call
        image: ghcr.io/element-hq/lk-jwt-service:0.5.0
        restart: unless-stopped
        environment:
            - LIVEKIT_JWT_BIND=:8081
            - LIVEKIT_URL=wss://${RTC_SUBDOMAIN}
            - LIVEKIT_KEY=${LIVEKIT_KEY}
            - LIVEKIT_SECRET=${LIVEKIT_SECRET}
            - LIVEKIT_FULL_ACCESS_HOMESERVERS=${SERVER_NAME}
        networks:
            - caddy
        labels:
            caddy: ${RTC_SUBDOMAIN}
            caddy.@jwt.path: /sfu/get* /healthz*
            caddy.route.0_reverse_proxy: "@jwt {{upstreams 8081}}"
            caddy.route.1_reverse_proxy: host.docker.internal:7880

    www:
        image: nginx:1.31.6-alpine
        restart: unless-stopped
        volumes:
            - ./www:/usr/share/nginx/html:ro
        networks:
            - caddy
        labels:
            caddy: join.${SERVER_NAME}
            caddy.reverse_proxy: "{{upstreams 80}}"

    matrix-rtc-livekit:
        # LiveKit: WebRTC SFU for group calls (Element Call)
        image: livekit/livekit-server:v1.13.8
        restart: unless-stopped
        command: --config /etc/livekit.yaml
        network_mode: host
        environment:
            - "LIVEKIT_KEYS=${LIVEKIT_KEY}: ${LIVEKIT_SECRET}"
        volumes:
            - ./livekit.yaml:/etc/livekit.yaml:ro

volumes:
    db:
    backups:
    caddy_data:

networks:
    caddy:
        external: true
